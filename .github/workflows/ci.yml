name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolkit
          key: toolchain-${{ hashFiles('tools/fetch_toolchain.py', 'tools/fetch_libs.py') }}

      - name: Fetch the compiler packages
        run: python -I tools/fetch_toolchain.py 6.0 6.3 6.4 6.5pp 7.0

      - name: Fetch the SDK headers and link libraries
        run: python -I tools/fetch_libs.py --libs

      - name: Build every image
        run: python -I build.py -j 4
